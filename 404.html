<style>
:root{--bg:#0b0b0b;--accent:#e6e6e6;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--accent);font-family:system-ui, sans-serif}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:6px;position:sticky;top:0;left:0;background:none;border:0}
button{background:transparent;border:0;color:var(--accent);padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
svg{width:24px;height:24px;stroke:currentColor}
textarea{flex:1;background:transparent;border:0;outline:none;padding:20px;color:var(--accent);resize:none;font-size:20px;line-height:1.5;font-family:ui-monospace, monospace}
.main{flex:1;display:flex}
.preview-full{display:none;align-items:center;justify-content:center;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;color:#fff;z-index:10;padding:20px}
.preview-full.show{display:flex}
.preview-text{line-height:1.3;text-align:center;white-space:pre-wrap;max-width:90vw;word-wrap:break-word}
</style>
</head>
<body>
<div class="app">
<div class="topbar">
<button id="btn-preview" title="Preview">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><path d="m12 15 5 6H7Z"/></svg>
</button>
<button id="btn-pip" title="Picture-in-Picture">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M2 10h6V4"/><path d="m2 4 6 6"/><path d="M21 10V7a2 2 0 0 0-2-2h-7"/><path d="M3 14v2a2 2 0 0 0 2 2h3"/><rect x="12" y="14" width="10" height="7" rx="1"/></svg>
</button>
</div>

<div class="main">
<textarea id="editor" placeholder="Type your stage text here..."></textarea>
</div>
</div>

<div id="previewFull" class="preview-full">
<div class="preview-text" id="previewText"></div>
</div>

<script>
const editor=document.getElementById('editor');
const btnPreview=document.getElementById('btn-preview');
const btnPip=document.getElementById('btn-pip');
const previewFull=document.getElementById('previewFull');
const previewText=document.getElementById('previewText');

function autoFontSize(){
const max=window.innerHeight*0.8;let size=100;const min=16;
previewText.style.fontSize=size+'px';
while(previewText.scrollHeight>max&&size>min){size-=2;previewText.style.fontSize=size+'px';}
}

async function openPreview(){
previewText.textContent=editor.value||'—';
previewFull.classList.add('show');
autoFontSize();
try{if(previewFull.requestFullscreen)await previewFull.requestFullscreen();}catch(e){}
try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}
}

function closePreview(){
previewFull.classList.remove('show');
try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}
}

async function openPiP(){
try{
if(!document.pictureInPictureElement){
const blob=new Blob([`<html><body style='background:black;margin:0;color:white;display:flex;align-items:center;justify-content:center;'><div style='font-size:2vw;text-align:center;white-space:pre-wrap;'>${editor.value||'—'}</div></body></html>`],{type:'text/html'});
const url=URL.createObjectURL(blob);
const video=document.createElement('video');
video.src=url;video.autoplay=true;video.muted=true;video.play();
await video.requestPictureInPicture();
}else{await document.exitPictureInPicture();}
}catch(e){console.warn('PiP not supported',e);}
}

btnPreview.addEventListener('click',openPreview);
btnPip.addEventListener('click',openPiP);
previewFull.addEventListener('click',closePreview);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePreview();});
window.addEventListener('resize',()=>{if(previewFull.classList.contains('show'))autoFontSize();});
</script>
</body>
