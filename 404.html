<style>
:root{--bg:#0b0b0b;--accent:#e6e6e6;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--accent);font-family:system-ui,sans-serif;font-weight:bold;display:flex;flex-direction:column}
nav{display:flex;align-items:center;gap:8px;padding:6px;flex-shrink:0}
button{background:transparent;border:0;color:var(--accent);padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
svg{width:24px;height:24px;stroke:currentColor}
textarea{flex:1;background:transparent;border:0;outline:none;padding:20px;color:var(--accent);resize:none;font-size:20px;line-height:1.5;font-family:ui-monospace,monospace;font-weight:bold}
.preview-full{display:none;align-items:center;justify-content:center;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;color:#fff;z-index:10;padding:20px;font-weight:bold}
.preview-full.show{display:flex}
.preview-text{line-height:1.3;text-align:center;white-space:pre-wrap;max-width:90vw;word-wrap:break-word;font-weight:bold}
</style>
</head>
<body>

<nav>
<button title="Preview" onmousedown="openPreview()">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><path d="m12 15 5 6H7Z"/></svg>
</button>
<button title="Picture-in-Picture" onmousedown="openPiP()">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M2 10h6V4"/><path d="m2 4 6 6"/><path d="M21 10V7a2 2 0 0 0-2-2h-7"/><path d="M3 14v2a2 2 0 0 0 2 2h3"/><rect x="12" y="14" width="10" height="7" rx="1"/></svg>
</button>
</nav>

<textarea id="editor" placeholder="Type your stage text here..." oninput="renderToCanvas()"></textarea>

<section id="previewFull" class="preview-full" onmousedown="closePreview()">
<div class="preview-text" id="previewText"></div>
</section>

<canvas id="canvas" width="640" height="360" style="display:none"></canvas>
<video id="video" style="display:none" autoplay muted playsinline></video>

<script>
const editor=document.getElementById('editor')
const previewFull=document.getElementById('previewFull')
const previewText=document.getElementById('previewText')
const canvas=document.getElementById('canvas')
const ctx=canvas.getContext('2d')
const video=document.getElementById('video')
let stream, anim

function autoFontSize(){
const max=window.innerHeight*0.8;let size=100;const min=16
previewText.style.fontSize=size+'px'
while(previewText.scrollHeight>max&&size>min){size-=2;previewText.style.fontSize=size+'px'}
}

async function openPreview(){
previewText.textContent=editor.value||'—'
previewFull.classList.add('show')
autoFontSize()
try{if(previewFull.requestFullscreen)await previewFull.requestFullscreen()}catch{}
try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch{}
}

function closePreview(){
previewFull.classList.remove('show')
try{if(document.fullscreenElement)document.exitFullscreen()}catch{}
}

function renderToCanvas(){
ctx.fillStyle='black'
ctx.fillRect(0,0,canvas.width,canvas.height)
ctx.fillStyle='white'
ctx.textAlign='center'
ctx.textBaseline='middle'
ctx.font='bold 48px system-ui,sans-serif'
const text=editor.value.trim()||'—'
const lines=text.split('\n')
lines.forEach((line,i)=>{ctx.fillText(line,canvas.width/2,canvas.height/2+(i*60)-(lines.length-1)*30)})
}

async function openPiP(){
try{
if(!document.pictureInPictureElement){
renderToCanvas()
stream=canvas.captureStream(30)
video.srcObject=stream
await video.play().catch(()=>{})
await video.requestPictureInPicture()
animateCanvas()
}else{
cancelAnimationFrame(anim)
await document.exitPictureInPicture()
}
}catch(e){console.warn('PiP not supported',e)}
}

function animateCanvas(){
renderToCanvas()
anim=requestAnimationFrame(animateCanvas)
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closePreview()})
window.addEventListener('resize',()=>{if(previewFull.classList.contains('show'))autoFontSize()})
renderToCanvas()
</script>

</body>
